name: Irovi
options:
  bundleIdPrefix: com.irovi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Irovi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Irovi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IROVI_BUNDLE_ID)
        INFOPLIST_FILE: Irovi/Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES

  IroviTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: IroviTests
    dependencies:
      - target: Irovi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(IROVI_BUNDLE_ID).tests

  IroviUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: IroviUITests
    dependencies:
      - target: Irovi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(IROVI_BUNDLE_ID).uitests

schemes:
  Irovi:
    build:
      targets:
        Irovi: all
        IroviTests: [test]
        IroviUITests: [test]
    test:
      targets:
        - IroviTests
        - IroviUITests
